# ============================================================
# 最终部署配置 - Final Parameters for Deployment
# ============================================================
# 差分进化优化结果: Average RMSE = 0.7364°
# 优化日期: 2026-01-07
# 
# 警告: 这是仿真环境的最优参数，请勿继续调参（避免过拟合）
# ============================================================

# 过程噪声
Q_gyro: 1.0e-5      # 陀螺仪噪声功率谱密度 (rad/s)^2/Hz
Q_bias: 1.0e-8      # 偏置随机游走功率谱密度 (rad/s)^2/Hz

# ========== 核心优化参数 (DE 优化结果) ==========
R0: 5.49e-4         # 基准测量噪声方差 (优化值: 0.000549)

# 方向量测开关
use_direction_meas: true

# 初始不确定度
init_P_att: 7.6e-3  # (5°)^2 in rad^2
init_P_bias: 1.0e-4 # (0.01 rad/s)^2

# 新息统计配置
innovation_stat:
  window_W: 50
  nis_high: 8.54    # 统计学阈值 (优化值)
  nis_low: 2.0
  ewma_alpha: 0.15

# 双通道检测
dual_channel:
  enabled: true
  mag_weight: 50.0
  mag_sigma: 0.05
  combine_mode: "max"
  vibration_aware: false

# 自适应参数
adaptation:
  r_up: 2.0
  r_down: 0.95
  lambda_max: 100000.0
  lambda_min: 1.0
  
  # inflate 映射
  use_inflate_mapping: true
  inflate_decay_rate: 0.92
  inflate_rise_smooth: 1.0
  
  # 动态感知策略
  use_dynamic_aware: true
  mag_threshold: 0.1
  mag_lambda_gain: 5000.0
  gyro_threshold: 0.05
  dynamic_alpha: 0.3
  acc_vec_alpha: 0.1
  vib_threshold: 0.05
  
  # ========== 核心优化参数 (DE 优化结果) ==========
  acc_window_size: 20           # 滑动窗口大小
  vib_var_threshold: 0.06       # 振动方差阈值 (优化值: ~0.0595)
  maneuver_mean_threshold: 0.4
  lambda_vibration: 200.0       # 振动时的λ (优化值: 强力抗震)
  
  soft_saturation: false
  lambda_soft_max: 50.0
  ewma_lambda_alpha: 0.0

# ZARU 零角速度修正
zaru:
  enabled: true
  acc_std_threshold: 0.01
  gyro_threshold: 0.02
  r_scale: 0.01
  q_att_scale: 0.001
  confirm_count: 10

# LPF 数字低通滤波
lpf:
  enabled: true               # 实物部署时建议开启
  acc_cutoff: 15.0
  gyro_cutoff: 30.0
  use_filtfilt: false         # 实物用单向滤波

# 日志配置
logging:
  save_nis: true
  save_lambda: true

# ============================================================
# 性能指标 (仿真验证)
# ============================================================
# | 场景       | RMSE (°) |
# |------------|----------|
# | Static     | ~0.15    |
# | Vibration  | ~0.49    |
# | Accel      | ~0.27    |
# | Turn       | ~2.0     |
# | Average    | 0.7364   |
# ============================================================
