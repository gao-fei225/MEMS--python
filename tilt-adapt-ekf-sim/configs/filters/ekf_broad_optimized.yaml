# 针对 BROAD 数据集优化的自适应 EKF 配置
# 优化目标：最小化 Roll/Pitch/Yaw 误差

# 过程噪声
Q_gyro: 8.0e-6  # 适中值
Q_bias: 8.0e-9  # 适中值

# 基准测量噪声
R0: 4.0e-3  # 适中值

# 方向量测开关
use_direction_meas: true

# 初始不确定度
init_P_att: 6.0e-3
init_P_bias: 8.0e-5

# 新息统计配置
innovation_stat:
  window_W: 60  # 适中
  nis_high: 11.0
  nis_low: 1.8
  ewma_alpha: 0.12

# 双通道检测
dual_channel:
  enabled: true
  mag_weight: 90.0
  mag_sigma: 0.9
  combine_mode: "max"
  vibration_aware: false

# 自适应参数
adaptation:
  r_up: 1.9
  r_down: 0.96
  lambda_max: 900.0
  lambda_min: 0.9
  
  use_inflate_mapping: true
  inflate_decay_rate: 0.89
  inflate_rise_smooth: 1.0
  
  # 动态感知策略
  use_dynamic_aware: true
  mag_threshold: 0.22
  mag_lambda_gain: 135.0
  gyro_threshold: 0.09
  dynamic_alpha: 0.18
  acc_vec_alpha: 0.18
  vib_threshold: 0.09
  acc_window_size: 22
  vib_var_threshold: 0.11
  maneuver_mean_threshold: 0.45
  lambda_vibration: 90.0
  
  soft_saturation: false
  ewma_lambda_alpha: 0.08

# ZARU - 静止检测
zaru:
  enabled: true
  acc_std_threshold: 0.028
  gyro_threshold: 0.028
  r_scale: 0.08
  q_att_scale: 0.008
  confirm_count: 28

# LPF
lpf:
  enabled: true
  acc_cutoff: 9.0
  gyro_cutoff: 45.0
  use_filtfilt: true

# 磁力计融合
magnetometer:
  enabled: true
  R_mag: 0.45
  declination: 0.0
  norm_threshold: 0.09

# VQF 风格捷联预滤波
strapdown_prefilter:
  enabled: true
  cutoff: 0.45
  alpha: 0.0045
