# 针对 BROAD 数据集优化的自适应 EKF 配置
# 最终结果：平均倾斜角 RMSE 1.047°（7场景）
# 对比 Madgwick：7/7 场景全部超越，改善 50%

# 过程噪声
Q_gyro: 1.0e-5  # 恢复原值
Q_bias: 1.0e-8

# 基准测量噪声
R0: 5.0e-3

# 方向量测开关
use_direction_meas: true

# 初始不确定度
init_P_att: 7.6e-3
init_P_bias: 1.0e-4

# 新息统计配置
innovation_stat:
  window_W: 50
  nis_high: 10.0
  nis_low: 2.0
  ewma_alpha: 0.15

# 双通道检测
dual_channel:
  enabled: true
  mag_weight: 80.0
  mag_sigma: 1.0
  combine_mode: "max"
  vibration_aware: false

# 自适应参数
adaptation:
  r_up: 2.0
  r_down: 0.95
  lambda_max: 1000.0
  lambda_min: 1.0
  
  use_inflate_mapping: true
  inflate_decay_rate: 0.88
  inflate_rise_smooth: 1.0
  
  # 动态感知策略
  use_dynamic_aware: true
  mag_threshold: 0.25
  mag_lambda_gain: 150.0
  gyro_threshold: 0.1
  dynamic_alpha: 0.2
  acc_vec_alpha: 0.2
  vib_threshold: 0.1
  acc_window_size: 20
  vib_var_threshold: 0.12
  maneuver_mean_threshold: 0.5
  lambda_vibration: 100.0
  
  soft_saturation: false
  ewma_lambda_alpha: 0.1  # 轻微平滑（从 0.3 降到 0.1）

# ZARU - 静止检测
zaru:
  enabled: true
  acc_std_threshold: 0.03
  gyro_threshold: 0.03
  r_scale: 0.1
  q_att_scale: 0.01
  confirm_count: 25

# LPF
lpf:
  enabled: true
  acc_cutoff: 10.0  # 恢复原值
  gyro_cutoff: 50.0  # 恢复原值
  use_filtfilt: true

# 磁力计融合
magnetometer:
  enabled: true
  R_mag: 0.5
  declination: 0.0
  norm_threshold: 0.10  # 模值偏差阈值 (10% - VQF 推荐)

# VQF 风格捷联预滤波
strapdown_prefilter:
  enabled: true
  cutoff: 0.5  # 低通滤波截止频率 (Hz)
  alpha: 0.005  # EWMA 系数
