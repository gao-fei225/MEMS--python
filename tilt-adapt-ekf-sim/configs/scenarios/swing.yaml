# Swing Scenario
# 摆动工况

scenario:
  name: swing
  duration: 60.0  # seconds
  
trajectory:
  type: sinusoidal
  axes: [roll, pitch]
  amplitude: [10.0, 10.0]  # degrees
  frequency: [0.5, 0.3]    # Hz
  phase: [0.0, 90.0]       # degrees
  
linear_accel:
  enabled: false
  
temperature:
  enabled: false
  ambient: 25.0
