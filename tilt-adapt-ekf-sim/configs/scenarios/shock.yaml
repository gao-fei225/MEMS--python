# Shock Scenario
# 冲击工况

scenario:
  name: shock
  duration: 10.0  # seconds
  
trajectory:
  type: static
  initial_attitude: [0.0, 0.0, 0.0]
  
linear_accel:
  enabled: true
  type: shock
  peak_accel: 50.0    # m/s^2
  duration: 0.01      # seconds
  times: [2.0, 5.0, 8.0]  # shock occurrence times
  
temperature:
  enabled: false
  ambient: 25.0
